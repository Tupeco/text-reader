# Serves the built app. For a sub-path build (BASE_PATH), the Dockerfile links BASE_PATH to the web
# root, so requests work both with the prefix and with the prefix stripped by the reverse proxy.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Behind a reverse proxy: keep redirects relative so they don't point at :8080.
    absolute_redirect off;
    # The client address for the API's rate limit: taken from X-Forwarded-For when the request comes
    # from a private address (the reverse proxy). The rightmost untrusted address is used, which a
    # client cannot forge by sending its own X-Forwarded-For.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 127.0.0.0/8;
    set_real_ip_from fc00::/7;
    set_real_ip_from ::1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    server_tokens off;

    types {
        application/javascript js mjs;
        application/wasm wasm;
        application/manifest+json webmanifest;
        application/octet-stream onnx data;
        application/json json;
        text/plain txt;
        text/html html;
        text/css css;
        image/svg+xml svg;
        image/png png;
    }
    default_type application/octet-stream;

    gzip on;
    gzip_types application/javascript application/wasm text/css application/manifest+json image/svg+xml;

    # Missing files must return 404, never index.html: Transformers.js checks which model files exist,
    # and the service worker already handles app navigation offline.
    location / {
        include /etc/nginx/card-reader-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/index.html =404;
    }

    # Translation API (compose service "api"), at <BASE_PATH>api/ whether or not the proxy strips
    # BASE_PATH. The name is resolved per request (Docker's DNS), so nginx also starts without the
    # service; the app then translates on the device.
    location ~ /api/ {
        include /etc/nginx/card-reader-headers.conf;
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $api api:8080;
        rewrite ^.*/api/(.*)$ /api/$1 break;
        proxy_pass http://$api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 240s;
        client_max_body_size 64k;
    }

    # Content-hashed build output.
    location ~ /assets/ {
        include /etc/nginx/card-reader-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # The GPL text has no extension; show it in the browser (linked from Settings → About).
    location ~ /piper/COPYING$ {
        include /etc/nginx/card-reader-headers.conf;
        add_header Cache-Control "no-cache" always;
        default_type text/plain;
        types { }
        charset utf-8;
        try_files $uri =404;
    }

    # Translation models and Piper files. Transformers.js probes them with one-byte Range requests,
    # which nginx only honours for uncompressed responses. A full response would be cached by the
    # service worker and race the real download, so gzip stays off here.
    location ~ /(models|piper)/ {
        include /etc/nginx/card-reader-headers.conf;
        add_header Cache-Control "no-cache" always;
        gzip off;
        try_files $uri =404;
    }
}
