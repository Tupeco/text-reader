# Serves the built app. The image puts it at the BASE_PATH it was built for (/ by default), so a
# reverse proxy serving it under a sub-path should forward the path unchanged (not strip the prefix).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Behind a reverse proxy: keep redirects relative so they don't point at :8080.
    absolute_redirect off;
    server_tokens off;

    types {
        application/javascript js mjs;
        application/wasm wasm;
        application/manifest+json webmanifest;
        application/octet-stream onnx data;
        application/json json;
        text/plain txt;
        text/html html;
        text/css css;
        image/svg+xml svg;
        image/png png;
    }
    default_type application/octet-stream;

    gzip on;
    gzip_types application/javascript application/wasm text/css application/manifest+json image/svg+xml;

    # Missing files must return 404, never index.html: Transformers.js checks which model files exist,
    # and the service worker already handles app navigation offline.
    location / {
        include /etc/nginx/card-reader-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/index.html =404;
    }

    # Content-hashed build output.
    location ~ /assets/ {
        include /etc/nginx/card-reader-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # The GPL text has no extension; show it in the browser (linked from Settings → About).
    location ~ /piper/COPYING$ {
        include /etc/nginx/card-reader-headers.conf;
        add_header Cache-Control "no-cache" always;
        default_type text/plain;
        types { }
        charset utf-8;
        try_files $uri =404;
    }

    # Translation models and Piper files. Transformers.js probes them with one-byte Range requests,
    # which nginx only honours for uncompressed responses. A full response would be cached by the
    # service worker and race the real download, so gzip stays off here.
    location ~ /(models|piper)/ {
        include /etc/nginx/card-reader-headers.conf;
        add_header Cache-Control "no-cache" always;
        gzip off;
        try_files $uri =404;
    }
}
