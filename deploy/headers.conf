# Included in every location: nginx drops server-level add_header lines in any location that
# sets its own, so they are repeated through this file.
# Cross-origin isolation enables SharedArrayBuffer (multi-threaded wasm). The service worker adds
# these too, but sending them here makes the very first page load isolated as well.
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Embedder-Policy "require-corp" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
